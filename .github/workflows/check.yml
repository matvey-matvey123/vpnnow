name: VPN Server Check

# Когда запускать проверку
on:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов (в 00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:  # Возможность ручного запуска
  push:
    branches: [ main ]  # При пуше в main ветку

jobs:
  check:
    runs-on: ubuntu-latest  # Используем Ubuntu
    
    steps:
    # Клонируем репозиторий
    - uses: actions/checkout@v3
    
    # Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    # Устанавливаем зависимости
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Запускаем проверку
    - name: Run VPN checker
      run: python checker.py
    
    # Сохраняем результаты
    - name: Commit results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add working_servers.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Update working servers $(date +'%Y-%m-%d %H:%M:%S')" && git push)
