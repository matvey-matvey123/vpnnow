name: VPN Server Check

# Когда запускать проверку
on:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов
  workflow_dispatch:  # Ручной запуск
  push:
    branches: [ main ]

# Права для записи в репозиторий
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    # Клонируем репозиторий (обновленная версия)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # Устанавливаем Python (обновленная версия)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    # Устанавливаем зависимости
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Запускаем проверку
    - name: Run VPN checker
      run: python checker.py
    
    # Показываем результаты в логах
    - name: Show results
      run: |
        echo "=== РЕЗУЛЬТАТЫ ПРОВЕРКИ ==="
        cat working_servers.txt
    
    # Сохраняем результаты
    - name: Commit and push results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Проверяем, есть ли изменения
        if [[ -n $(git status --porcelain) ]]; then
          git add working_servers.txt
          git commit -m "🔄 Update working servers $(date +'%Y-%m-%d %H:%M:%S')"
          
          # Пробуем запушить с rebase
          git pull --rebase origin main || true
          git push origin main || git push origin HEAD:main
        else
          echo "✅ Нет изменений для коммита"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
